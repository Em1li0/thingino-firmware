# CRA Compliance: Security Policy for Thingino Firmware
# See: https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/adding-a-security-policy-to-your-repository

## 🛡️ Security Policy

This repository implements a **CRA-compliant security policy** for firmware development and distribution.

---

## 📬 Reporting a Vulnerability

**For CRA-compliant vulnerability reporting:**

- **Email:** security@cra-consulting.com
- **Response Time:** 
  - Critical vulnerabilities: Within 24 hours
  - High vulnerabilities: Within 7 days
  - Medium/low: Within 30 days
- **Disclosure:** Full public disclosure after patch is available and verified

**Please include:**
- Vulnerability details
- Steps to reproduce
- Impact assessment
- Suggested mitigation

---

## 🔒 Vulnerability Assessment Process

### Automated Scanning (On Every Push)
- **Trivy:** Filesystem vulnerability scanning
- **Grype:** SBOM-based vulnerability scanning
- **Dependabot:** Dependency vulnerability alerts
- **GitHub Code Scanning:** Static analysis

### Manual Assessment
- Code reviews for all pull requests
- Security check before releases
- Quarterly penetration testing (recommended)

---

## 📋 Security Updates Process

1. **Automated Alerts:**
   - Dependabot opens PRs for vulnerable dependencies
   - Trivy/Grype scan results appear in Security Tab

2. **Manual Review:**
   - Security team reviews alerts within 24 hours for critical issues
   - Maintainers review and fix vulnerabilities

3. **Verification:**
   - Fixes are merged and re-scanned
   - Release notes document all vulnerabilities fixed

### Timelines
| Severity | Response Time | Fix Timeline |
|----------|---------------|--------------|
| Critical | 24 hours | 7 days |
| High | 7 days | 30 days |
| Medium | 30 days | Next release |
| Low | Next sprint | Next release |

---

## 📄 SBOM (Software Bill of Materials)

### Generation
- **Tool:** [Syft](https://github.com/anchore/syft) by Anchore
- **Format:** SPDX JSON (CRA-compliant)
- **Frequency:** On every push to `cra-compliance` branch
- **Access:** GitHub Actions Artifacts

### CRA Compliance
- ✅ **Article 11:** SBOM generation is mandatory
- ✅ **Article 11:** SBOM must be accessible
- ✅ **Article 20:** Transparency requirements

### Contents
- All source files with checksums
- Complete dependency tree with versions
- License information for each component
- Package managers: GitHub Actions, Docker, pip, npm, Maven, vcpkg, Bundler, gomod, cargo, composer, nuget, gitsubmodule

---

## 🔐 Supply Chain Security

### SLSA Framework
- **Level:** SLSA Level 2 (CRA-compliant)
- **Implementation:** GitHub Actions with secure workflows
- **Purpose:** Provides cryptographically verifiable provenance

### Components
- **Build Process:** GitHub Actions workflows
- **Source Control:** Git commit hashes tracked
- **Build Integrity:** Secure CI/CD pipeline

