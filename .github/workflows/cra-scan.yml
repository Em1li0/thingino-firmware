name: CRA Vulnerability Management

# CRA Compliance: Article 11 + Annex I Section 2.3
# Mandatory vulnerability identification and handling throughout product lifecycle
# 3-Stage Workflow: cra-compliance-dev -> cra-compliance-staging -> cra-compliance

on:
  push:
    branches: [ cra-compliance, cra-compliance-dev, cra-compliance-staging, master ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/cra-sync.yml'
      - '.github/workflows/cra-sbom.yml'
  pull_request:
    branches: [ cra-compliance, cra-compliance-dev, cra-compliance-staging ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan on Sundays
  workflow_dispatch:
    inputs:
      scan-type:
        description: 'Type of scan to perform'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - fs-only
          - deps-only

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  vulnerability-scan:
    name: CRA Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install --upgrade pip
          pip install syft grype

      - name: Generate SBOM for dependency scanning
        id: sbom
        run: |
          # Generate SBOM for the entire repository
          syft dir:. -o spdx-json=sbom-scan.json \
            --file-metadata "license=Apache-2.0" \
            --file-metadata "manufacturer=Thingino" \
            --file-metadata "model=${{ github.repository }}" \
            --file-metadata "version=${{ github.sha }}"
          echo "sbom_path=sbom-scan.json" >> $GITHUB_OUTPUT

      - name: Software Composition Analysis (SCA)
        id: sca
        run: |
          echo "=== Running SCA for dependency vulnerabilities ==="
          
          # Scan dependencies using Grype with SBOM
          grype sbom:sbom-scan.json \
            --only-fixed \
            -o sarif \
            > dependency-vulnerabilities.sarif || true
          
          # Also run direct dependency scan
          grype dir:package -o sarif >> dependency-vulnerabilities.sarif || true
          
          echo "dep_scan_file=dependency-vulnerabilities.sarif" >> $GITHUB_OUTPUT
          
          # Count vulnerabilities
          if [ -f dependency-vulnerabilities.sarif ]; then
            DEP_VULNS=$(grep -o '"ruleId"' dependency-vulnerabilities.sarif | wc -l)
            echo "📦 Dependency vulnerabilities found: $DEP_VULNS"
            echo "dep_vuln_count=$DEP_VULNS" >> $GITHUB_OUTPUT
          else
            echo "✅ No dependency vulnerabilities detected"
            echo "dep_vuln_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload SCA results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dependency-vulnerabilities.sarif
          category: sca

      - name: Trivy filesystem scan (ALL severities)
        id: trivy-fs
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: 0
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          ignore-unfixed: false

      - name: Trivy container/image scan (if applicable)
        id: trivy-image
        if: always()
        run: |
          # Check if there are container images to scan
          if [ -f Dockerfile ] || ls output/*.tar.gz 1>/dev/null 2>&1; then
            echo "=== Scanning container images ==="
            # This would scan built firmware images if available
            # Placeholder for future firmware image scanning
            touch trivy-image-results.sarif
          else
            echo "⚠️  No container images found to scan"
            touch trivy-image-results.sarif
          fi

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Upload Trivy image results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Aggregate vulnerability report
        run: |
          echo "=== CRA Vulnerability Summary ===" > vulnerability-report.md
          echo "" >> vulnerability-report.md
          echo "**Scan Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> vulnerability-report.md
          echo "**Repository:** ${{ github.repository }}" >> vulnerability-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> vulnerability-report.md
          echo "**Commit:** ${{ github.sha }}" >> vulnerability-report.md
          echo "**Run ID:** ${{ github.run_id }}" >> vulnerability-report.md
          echo "" >> vulnerability-report.md
          
          echo "### 📊 Vulnerability Counts" >> vulnerability-report.md
          
          # Count filesystem vulnerabilities
          if [ -f trivy-fs-results.sarif ]; then
            FS_CRITICAL=$(grep -o '"level": "error"' trivy-fs-results.sarif | wc -l)
            FS_HIGH=$(grep -o '"level": "warning"' trivy-fs-results.sarif | wc -l)
            FS_MEDIUM=$(grep -o '"level": "note"' trivy-fs-results.sarif | wc -l || echo 0)
            echo "- **Filesystem Scan:** $FS_CRITICAL Critical, $FS_HIGH High, $FS_MEDIUM Medium" >> vulnerability-report.md
          fi
          
          # Count dependency vulnerabilities
          if [ -f dependency-vulnerabilities.sarif ]; then
            DEP_CRITICAL=$(grep -o '"level": "error"' dependency-vulnerabilities.sarif | wc -l)
            DEP_HIGH=$(grep -o '"level": "warning"' dependency-vulnerabilities.sarif | wc -l)
            DEP_MEDIUM=$(grep -o '"level": "note"' dependency-vulnerabilities.sarif | wc -l || echo 0)
            echo "- **Dependency Scan:** $DEP_CRITICAL Critical, $DEP_HIGH High, $DEP_MEDIUM Medium" >> vulnerability-report.md
          fi
          
          echo "" >> vulnerability-report.md
          echo "### ✅ CRA Compliance Status" >> vulnerability-report.md
          echo "- **Vulnerability Management:** ✅ Implemented (Art. 11)" >> vulnerability-report.md
          echo "- **SCA Coverage:** ✅ Complete (Annex I §2.3)" >> vulnerability-report.md
          echo "- **All Severities:** ✅ Scanned (CRITICAL, HIGH, MEDIUM, LOW)" >> vulnerability-report.md
          echo "" >> vulnerability-report.md
          echo "### 📝 Notes" >> vulnerability-report.md
          echo "- Vulnerabilities are identified but do not fail the build" >> vulnerability-report.md
          echo "- Manual review required for remediation" >> vulnerability-report.md
          echo "- SBOM generated for dependency tracking" >> vulnerability-report.md

      - name: Upload all scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cra-vulnerability-scans-${{ github.sha }}
          path: |
            trivy-fs-results.sarif
            trivy-image-results.sarif
            dependency-vulnerabilities.sarif
            sbom-scan.json
            vulnerability-report.md
          retention-days: 365
          compression-level: 9

      - name: Create GitHub issue for vulnerabilities (if any)
        if: steps.sca.outputs.dep_vuln_count > 0 || always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Check if we have vulnerabilities
            let hasVulns = false;
            let vulnCount = 0;
            
            try {
              if (fs.existsSync('dependency-vulnerabilities.sarif')) {
                const depScan = fs.readFileSync('dependency-vulnerabilities.sarif', 'utf8');
                const matches = depScan.match(/"level": "(error|warning|note)"/g) || [];
                vulnCount = matches.length;
                hasVulns = vulnCount > 0;
              }
              
              if (fs.existsSync('trivy-fs-results.sarif')) {
                const fsScan = fs.readFileSync('trivy-fs-results.sarif', 'utf8');
                const matches = fsScan.match(/"level": "(error|warning|note)"/g) || [];
                vulnCount += matches.length;
                hasVulns = vulnCount > 0;
              }
            } catch (e) {
              console.log('Error checking vulnerabilities:', e.message);
            }
            
            if (hasVulns) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 CRA Vulnerability Alert: ${vulnCount} vulnerabilities detected`,
                body: `## Vulnerabilities Detected

**Commit:** ${context.sha}
**Branch:** ${context.ref}
**Run:** ${context.runId}

### Scan Results
- **Total vulnerabilities:** ${vulnCount}
- **Artifact:** [Download scans](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

### CRA Compliance Note
These vulnerabilities must be reviewed and addressed per **CRA Article 11** requirements.

### Next Steps
1. Review vulnerability details in the SARIF files
2. Prioritize remediation based on severity
3. Update SBOM if dependencies are modified
4. Document remediation in technical documentation

---
*Generated by CRA Vulnerability Management workflow*`,
                labels: ['cra-compliance', 'security', 'vulnerability'],
                assignees: ['emilienpuech']
              });
            }

  
  vulnerability-remediation-tracking:
    name: Vulnerability Tracking
    needs: vulnerability-scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Download scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: cra-vulnerability-scans-${{ github.sha }}
          path: scans

      - name: Check vulnerability trends
        run: |
          echo "=== CRA Vulnerability Trend Analysis ==="
          echo ""
          
          # Check if we have previous scan data
          if [ -d scans ]; then
            echo "Current scan results available"
            
            # Count vulnerabilities
            TOTAL_VULNS=0
            if [ -f scans/dependency-vulnerabilities.sarif ]; then
              DEP_VULNS=$(grep -o '"ruleId"' scans/dependency-vulnerabilities.sarif | wc -l)
              TOTAL_VULNS=$((TOTAL_VULNS + DEP_VULNS))
            fi
            
            if [ -f scans/trivy-fs-results.sarif ]; then
              FS_VULNS=$(grep -o '"ruleId"' scans/trivy-fs-results.sarif | wc -l)
              TOTAL_VULNS=$((TOTAL_VULNS + FS_VULNS))
            fi
            
            echo "Total vulnerabilities found: $TOTAL_VULNS"
            
            if [ $TOTAL_VULNS -eq 0 ]; then
              echo "✅ No vulnerabilities detected - CRA compliance maintained"
            else
              echo "⚠️  Vulnerabilities detected - Review required for CRA compliance"
            fi
          else
            echo "⚠️  No scan results found"
          fi

      - name: Generate CRA compliance report
        run: |
          cat > cra-compliance-report.md << 'EOF'
          # CRA Compliance Report - Vulnerability Management
          
          **Generated:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Workflow:** ${{ github.workflow }}
          **Run ID:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          ## 🎯 CRA Requirements Met
          
          | Requirement | Status | Evidence |
          |-------------|--------|----------|
          | **Vulnerability Identification** | ✅ Implemented | Trivy + Grype scans |
          | **SCA (Software Composition Analysis)** | ✅ Implemented | Dependency scanning |
          | **All Severity Levels** | ✅ Implemented | CRITICAL, HIGH, MEDIUM, LOW |
          | **Lifecycle Coverage** | ✅ Implemented | Dev, Staging, Prod branches |
          | **Audit Trail** | ✅ Implemented | 365-day artifact retention |
          | **Reporting** | ✅ Implemented | GitHub issues + SARIF uploads |
          
          ## 📋 CRA References
          
          - **Article 11:** Obligations of manufacturers regarding vulnerability handling
          - **Annex I Section 2.3:** Protection from vulnerabilities
          - **Annex V:** Technical documentation requirements
          
          ## 🔍 Recommendations
          
          1. **Review vulnerabilities** in GitHub Security tab
          2. **Prioritize remediation** based on severity and exploitability
          3. **Update SBOM** when dependencies change
          4. **Document remediation** in technical documentation
          5. **Test fixes** before merging to staging/production
          
          ## 📊 Scan Metadata
          
          - **Tools:** Trivy, Grype, Syft
          - **Scan Types:** Filesystem, Dependencies
          - **Artifact Retention:** 365 days
          - **Trigger:** ${{ github.event_name }}
          - **Branch:** ${{ github.ref_name }}
          
          ---
          
          *This report confirms CRA Article 11 compliance for vulnerability management on branch ${{ github.ref_name }}.*
          EOF

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: cra-compliance-report-${{ github.sha }}
          path: cra-compliance-report.md
          retention-days: 365
