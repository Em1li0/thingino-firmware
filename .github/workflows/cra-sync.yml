name: CRA Upstream Sync

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch:

jobs:
  cra-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config --global user.name "CRA Bot"
          git config --global user.email "cra@cra-consulting.com"
          git remote add upstream https://github.com/themactep/thingino-firmware.git
          git fetch upstream
          git merge upstream/master --no-edit -X theirs

      - name: Create PR to cra-compliance
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync with upstream"
          title: "chore: sync with upstream"
          body: "Automated sync with upstream repository"
          branch: "cra-sync-$(date +%Y%m%d)"
          base: cra-compliance
          delete-branch: true
